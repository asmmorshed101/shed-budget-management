spring:
  application:
    name: budget-management

  datasource:
    url: jdbc:postgresql://localhost:5432/government_budget
    username: postgres
    password: 12345

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081