spring.application.name=budget-management


spring.application.name=budget-management

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/government_budget
spring.datasource.username=postgres
spring.datasource.password=12345

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8081

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Operational Expenditure File Upload
app.file.upload-dir=uploads/operational-expenditures

# Set both variables to create the initial super administrator on first startup.
app.auth.bootstrap-email=${APP_AUTH_BOOTSTRAP_EMAIL:}
app.auth.bootstrap-password=${APP_AUTH_BOOTSTRAP_PASSWORD:}

# Multipart File Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
